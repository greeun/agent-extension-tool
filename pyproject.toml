[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "axt"
version = "1.7.0"
description = "Agent eXtension Tool — CLI + TUI for Claude Code extensions, plugins, skills, MCP servers, hooks, agents, and usage tracking"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "uni4love" }]
keywords = ["claude", "claude-code", "tui", "cli", "plugins", "skills", "mcp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: Console :: Curses",
    "Topic :: Utilities",
]
# Stdlib only — no runtime deps.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]
# Windows curses requires an external wheel.
windows = ["windows-curses>=2.3; sys_platform == 'win32'"]

[project.urls]
Homepage = "https://github.com/greeun/agent-extension-tool"
Repository = "https://github.com/greeun/agent-extension-tool"
Issues = "https://github.com/greeun/agent-extension-tool/issues"
Changelog = "https://github.com/greeun/agent-extension-tool/releases"

[project.scripts]
axt = "axt:main"

[tool.setuptools]
packages = ["axt", "axt.tui"]
package-data = { axt = ["pricing.json"] }
include-package-data = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
